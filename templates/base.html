<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ name }} — {{ role }}{% endblock %}</title>
  <meta name="description" content="{{ tagline }}">
  <link rel="icon" href="{{ url_for('static', filename='img/logo.svg') }}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Oswald:wght@500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <a class="skip" href="#content">Skip to content</a>
  <div class="bloom" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>
  <header class="top">
    <p class="status-pill"><span class="status-dot" aria-hidden="true"></span> Available to talk</p>
    {% include "_site_nav.html" %}
    <a class="btn top-call" href="{{ url_for('home') }}#contact">Call me, I pick up</a>
  </header>
  <main id="content">
    {% block content %}{% endblock %}
  </main>
  <footer class="foot">
    <p>© {{ year }} {{ name }}. Python software, shown as a live Flask app.</p>
    <p class="mono">GET /api/health → {"ok": true}</p>
  </footer>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
